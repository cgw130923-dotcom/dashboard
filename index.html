<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gunwoo Dashboard</title>

<style>

body{
margin:0;
background:#000000;
color:white;
font-family:Arial,sans-serif;
}

header{
text-align:center;
font-size:32px;
font-weight:bold;
padding:25px;
}

.container{
display:grid;
gap:15px;
padding:15px;
}

.card{
background:#111111;
border-radius:25px;
padding:22px;
}

.title{
font-size:23px;
text-align:center;
margin-bottom:15px;
}

.big{
font-size:55px;
text-align:center;
font-weight:bold;
}

.info{
font-size:19px;
line-height:1.8;
}

</style>

</head>


<body>


<header>
🌍 Gunwoo Dashboard
</header>


<div class="container">


<div class="card">
<div class="title">🕒 현재 시간</div>
<div id="clock" class="big"></div>
</div>


<div class="card">
<div class="title">📅 날짜</div>
<div id="date" class="info"></div>
</div>


<div class="card">
<div class="title">🌤 부산 날씨</div>
<div id="weather" class="info">
업데이트 중...
</div>
</div>


<div class="card">
<div class="title">🌋 최근 지진</div>
<div id="quake" class="info">
업데이트 중...
</div>
</div>


<div class="card">
<div class="title">💱 환율</div>
<div id="money" class="info">
업데이트 중...
</div>
</div>


<div class="card">
<div class="title">📰 한국 뉴스</div>
<div id="news" class="info">
업데이트 중...
</div>
</div>


</div>



<script>


// 시간

function updateClock(){

let now=new Date();

document.getElementById("clock").innerHTML=
now.toLocaleTimeString("ko-KR");


document.getElementById("date").innerHTML=
now.toLocaleDateString("ko-KR",
{
year:"numeric",
month:"long",
day:"numeric",
weekday:"long"
});

}

setInterval(updateClock,1000);
updateClock();




// 날씨

fetch(
"https://api.open-meteo.com/v1/forecast?latitude=35.1796&longitude=129.0756&current=temperature_2m,relative_humidity_2m"
)

.then(r=>r.json())

.then(d=>{

document.getElementById("weather").innerHTML=
"🌡️ 온도 : "+
d.current.temperature_2m+
"℃<br>"+
"💧 습도 : "+
d.current.relative_humidity_2m+
"%";

})

.catch(()=>{

document.getElementById("weather").innerHTML=
"날씨 연결 실패";

});





// 지진 3개

fetch(
"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"
)

.then(r=>r.json())

.then(d=>{


let text="";


for(let i=0;i<3;i++){

let q=d.features[i];

text+=
"📍 "+q.properties.place+
"<br>"+
"규모 : "+q.properties.mag+
"<br><br>";

}


document.getElementById("quake").innerHTML=text;


})

.catch(()=>{

document.getElementById("quake").innerHTML=
"지진 정보 연결 실패";

});






// 환율

fetch(
"https://open.er-api.com/v6/latest/USD"
)

.then(r=>r.json())

.then(d=>{

document.getElementById("money").innerHTML=
"🇺🇸 1달러 ≈ "+
Math.round(d.rates.KRW)+
"원";

})

.catch(()=>{

document.getElementById("money").innerHTML=
"환율 연결 실패";

});






// 뉴스 (한국어 제목 3개)

fetch(
"https://api.rss2json.com/v1/api.json?rss_url=https://www.yna.co.kr/rss/news.xml"
)

.then(r=>r.json())

.then(d=>{


let text="";


for(let i=0;i<3;i++){

text+=
"📰 "+
d.items[i].title+
"<br><br>";

}


document.getElementById("news").innerHTML=text;


})

.catch(()=>{

document.getElementById("news").innerHTML=
"뉴스 연결 실패";

});



</script>


</body>
</html>
