<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gunwoo Smart Dashboard</title>

<style>

body{
margin:0;
background:#050505;
color:white;
font-family:Arial,sans-serif;
}

header{
text-align:center;
font-size:32px;
font-weight:bold;
padding:25px;
}

.container{
display:grid;
gap:15px;
padding:15px;
}

.card{
background:#151515;
border-radius:25px;
padding:22px;
box-shadow:0 5px 20px #000;
}

.title{
font-size:24px;
text-align:center;
margin-bottom:15px;
}

.big{
font-size:55px;
text-align:center;
font-weight:bold;
}

.info{
font-size:19px;
line-height:1.8;
}


</style>

</head>


<body>


<header>
🌍 Gunwoo Smart Dashboard
</header>



<div class="container">



<div class="card">
<div class="title">🕒 현재 시간</div>
<div id="clock" class="big"></div>
</div>



<div class="card">
<div class="title">📅 날짜</div>
<div id="date" class="info"></div>
</div>



<div class="card">
<div class="title">🌤 부산 날씨</div>
<div id="weather" class="info">
불러오는 중...
</div>
</div>



<div class="card">
<div class="title">🌋 최근 지진 Earthquakes</div>

<div id="quake" class="info">
불러오는 중...
</div>

</div>




<div class="card">
<div class="title">💱 환율 Exchange</div>

<div id="money" class="info">
불러오는 중...
</div>

</div>




<div class="card">
<div class="title">📰 세계 뉴스 World News</div>

<div id="news" class="info">
불러오는 중...
</div>

</div>




<div class="card">

<div class="title">
⚾ 롯데 자이언츠 LOTTE GIANTS
</div>

<div class="info">

경기 정보 준비 중<br>
Game information coming soon

</div>

</div>



</div>



<script>


// 시간

function clock(){

let now=new Date();

document.getElementById("clock").innerHTML=
now.toLocaleTimeString("ko-KR");


document.getElementById("date").innerHTML=
now.toLocaleDateString("ko-KR",
{
year:"numeric",
month:"long",
day:"numeric",
weekday:"long"
});

}

setInterval(clock,1000);

clock();




// 날씨

fetch(
"https://api.open-meteo.com/v1/forecast?latitude=35.1796&longitude=129.0756&current=temperature_2m,relative_humidity_2m"
)

.then(r=>r.json())

.then(d=>{

weather.innerHTML=
"🌡️ 온도 Temperature : "+
d.current.temperature_2m+"℃"+
"<br>💧 습도 Humidity : "+
d.current.relative_humidity_2m+"%";

});





// 지진 여러개

fetch(
"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"
)

.then(r=>r.json())

.then(d=>{


let text="";


for(let i=0;i<5;i++){

let q=d.features[i];

text+=
"🌎 위치 : "+q.properties.place+
"<br>"+
"📏 규모 : "+
q.properties.mag+
"<br><br>";

}


quake.innerHTML=text;


});






// 환율

fetch(
"https://open.er-api.com/v6/latest/USD"
)

.then(r=>r.json())

.then(d=>{


money.innerHTML=
"🇺🇸 1 USD ≈ "+
Math.round(d.rates.KRW)+
" KRW";


});






// 뉴스

fetch(
"https://api.rss2json.com/v1/api.json?rss_url=https://www.ytn.co.kr/rss/news.xml"
)
)

.then(r=>r.json())

.then(d=>{


let text="";


for(let i=0;i<5;i++){

text+=
"🌍 "+
d.items[i].title+
"<br><br>";

}


news.innerHTML=text;


})

.catch(()=>{

news.innerHTML=
"뉴스 연결 실패";

});



</script>


</body>
</html>
