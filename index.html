<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gunwoo Dashboard V4</title>

<style>
body{
margin:0;
background:#08111f;
color:white;
font-family:Arial,sans-serif;
}

header{
text-align:center;
font-size:32px;
font-weight:bold;
padding:25px;
}

.container{
padding:15px;
display:grid;
gap:15px;
}

.card{
background:#172554;
border-radius:25px;
padding:20px;
text-align:center;
}

.title{
font-size:22px;
margin-bottom:15px;
}

.big{
font-size:55px;
font-weight:bold;
}

.info{
font-size:20px;
line-height:1.8;
}

</style>
</head>

<body>

<header>
🌍 Gunwoo Dashboard
</header>

<div class="container">

<div class="card">
<div class="title">🕒 현재 시간</div>
<div id="clock" class="big"></div>
</div>


<div class="card">
<div class="title">📅 날짜</div>
<div id="date" class="info"></div>
</div>


<div class="card">
<div class="title">🌤 부산 날씨</div>
<div id="weather" class="info">
불러오는 중...
</div>
</div>


<div class="card">
<div class="title">🌋 최근 지진</div>
<div id="quake" class="info">
불러오는 중...
</div>
</div>


<div class="card">
<div class="title">💱 환율</div>
<div id="money" class="info">
불러오는 중...
</div>
</div>


<div class="card">
<div class="title">📰 세계 뉴스</div>
<div class="info">
뉴스 연결 준비 중
</div>
</div>


<div class="card">
<div class="title">⚾ 롯데 자이언츠</div>
<div class="info">
경기 정보 준비 중
</div>
</div>

</div>


<script>

// 시간

function time(){

let now=new Date();

clock.innerHTML=
now.toLocaleTimeString("ko-KR");

date.innerHTML=
now.toLocaleDateString("ko-KR",
{
year:"numeric",
month:"long",
day:"numeric",
weekday:"long"
});

}

setInterval(time,1000);
time();




// 부산 날씨

fetch(
"https://api.open-meteo.com/v1/forecast?latitude=35.1796&longitude=129.0756&current=temperature_2m,relative_humidity_2m,weather_code"
)

.then(r=>r.json())

.then(d=>{

weather.innerHTML=
"🌡️ "+d.current.temperature_2m+"℃<br>"+
"💧 습도 "+d.current.relative_humidity_2m+"%";

});




// 지진

fetch(
"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"
)

.then(r=>r.json())

.then(d=>{

let q=d.features[0];

quake.innerHTML=
"📍 "+q.properties.place+
"<br>규모 "+q.properties.mag;

});




// 환율

fetch(
"https://open.er-api.com/v6/latest/USD"
)

.then(r=>r.json())

.then(d=>{

money.innerHTML=
"🇺🇸 1달러 ≈ "+
d.rates.KRW+
"원";

});


</script>


</body>
</html>
